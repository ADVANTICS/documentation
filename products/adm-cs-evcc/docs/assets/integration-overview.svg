<svg xmlns="http://www.w3.org/2000/svg" width="880" height="658" viewBox="0 0 880 658" role="img" aria-label="ADM-CS-EVCC overview: the controller drives the inlet signals; the DC contactors and the voltage and current sensing can be driven by either side; the VCU/BMS is always yours.">
  <title>ADM-CS-EVCC overview: the controller drives the inlet signals; the DC contactors and the voltage and current sensing can be driven by either side; the VCU/BMS is always yours.</title>
  <rect width="880" height="658" fill="#ffffff"/>
  <rect x="20.0" y="30.0" width="840.0" height="140.0" rx="14" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440.0" y="58.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle"><tspan x="440.0" dy="0">The controller drives all of this — you only wire it</tspan></text>
  <rect x="50.0" y="78.0" width="178.5" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="139.2" y="117.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="139.2" dy="0">CP / PP</tspan></text>
  <rect x="250.5" y="78.0" width="178.5" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="339.8" y="117.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="339.8" dy="0">Inlet lock</tspan></text>
  <rect x="451.0" y="78.0" width="178.5" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="540.2" y="117.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="540.2" dy="0">PT1000</tspan></text>
  <rect x="651.5" y="78.0" width="178.5" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="740.8" y="117.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="740.8" dy="0">HV pins</tspan></text>
  <line x1="139.2" y1="146.0" x2="139.2" y2="250.0" stroke="#1a365d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="339.8" y1="146.0" x2="339.8" y2="250.0" stroke="#1a365d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="540.2" y1="146.0" x2="540.2" y2="250.0" stroke="#1a365d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="740.8" y1="146.0" x2="740.8" y2="250.0" stroke="#1a365d" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="328.9" y="186.0" width="222.1" height="24.0" rx="12.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440.0" y="203.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#4a5568" text-anchor="middle"><tspan x="440.0" dy="0">dedicated hardware interfaces</tspan></text>
  <rect x="50.0" y="250.0" width="780.0" height="72.0" rx="10" fill="#00A99D" stroke="#00A99D" stroke-width="1.5"/>
  <text x="440.0" y="293.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="440.0" dy="0">ADM-CS-EVCC</tspan></text>
  <rect x="50.0" y="456.0" width="499.3" height="120.0" rx="12" fill="#e9f7f6" stroke="#8fd3cd" stroke-width="1.5"/>
  <text x="299.7" y="564.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#00A99D" text-anchor="middle"><tspan x="299.7" dy="0">The controller can optionally drive these</tspan></text>
  <rect x="575.3" y="456.0" width="254.7" height="120.0" rx="12" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/>
  <text x="702.7" y="564.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle"><tspan x="702.7" dy="0">Always yours to implement</tspan></text>
  <line x1="160.3" y1="322.0" x2="160.3" y2="470.0" stroke="#1a365d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="194.3" y1="322.0" x2="194.3" y2="470.0" stroke="#00A99D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="405.0" y1="322.0" x2="405.0" y2="470.0" stroke="#2d5aa0" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"/>
