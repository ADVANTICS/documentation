  <line x1="702.7" y1="322.0" x2="702.7" y2="470.0" stroke="#00A99D" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="66.0" y="470.0" width="222.7" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="177.3" y="509.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="177.3" dy="0">DC contactors</tspan></text>
  <rect x="310.7" y="470.0" width="222.7" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="422.0" y="500.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="422.0" dy="0">Voltage &amp; current</tspan><tspan x="422.0" dy="17">sensing</tspan></text>
  <rect x="591.3" y="470.0" width="222.7" height="68.0" rx="8" fill="#ffffff" stroke="#00A99D" stroke-width="1.5"/>
  <text x="702.7" y="509.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1a365d" text-anchor="middle"><tspan x="702.7" dy="0">VCU / BMS</tspan></text>
  <rect x="90.7" y="338.0" width="139.3" height="40.0" rx="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160.3" y="354.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a365d" text-anchor="middle"><tspan x="160.3" dy="0">H-bridge outputs</tspan><tspan x="160.3" dy="16">+ feedback inputs</tspan></text>
  <rect x="90.2" y="398.0" width="208.3" height="40.0" rx="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="194.3" y="414.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#00A99D" text-anchor="middle"><tspan x="194.3" dy="0">or the vehicle closes them,</tspan><tspan x="194.3" dy="16">on DC_Control</tspan></text>
  <rect x="356.0" y="338.0" width="97.9" height="40.0" rx="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="405.0" y="354.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#2d5aa0" text-anchor="middle"><tspan x="405.0" dy="0">a supported</tspan><tspan x="405.0" dy="16">CAN sensor</tspan></text>
  <rect x="338.3" y="398.0" width="201.4" height="40.0" rx="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="439.0" y="414.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#00A99D" text-anchor="middle"><tspan x="439.0" dy="0">or your BMS reports it,</tspan><tspan x="439.0" dy="16">in DC_Status1 / DC_Status2</tspan></text>
  <rect x="602.0" y="338.0" width="201.4" height="40.0" rx="20.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="702.7" y="354.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#00A99D" text-anchor="middle"><tspan x="702.7" dy="0">generic interface over CAN</tspan><tspan x="702.7" dy="16">or the J1939 bridge</tspan></text>
  <text x="440.0" y="606.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle"><tspan x="440.0" dy="0">Your vehicle</tspan></text>
  <line x1="24" y1="636" x2="50" y2="636" stroke="#1a365d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="58.0" y="640.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="58.0" dy="0">the controller drives it, through its own hardware interface</tspan></text>
  <line x1="468" y1="636" x2="494" y2="636" stroke="#00A99D" stroke-width="2.5" stroke-linecap="round"/>
  <text x="502.0" y="640.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="502.0" dy="0">you drive it, over the CAN bus</tspan></text>
  <line x1="720" y1="636" x2="746" y2="636" stroke="#2d5aa0" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="754.0" y="640.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4a5568" text-anchor="start"><tspan x="754.0" dy="0">optional alternative</tspan></text>
</svg>
