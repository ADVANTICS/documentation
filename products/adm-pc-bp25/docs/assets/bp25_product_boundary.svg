<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-label="ADM-PC-BP25 shown as one block inside an example finished AC/DC power conversion system. The module as supplied contains the 3-phase silicon carbide bridge, DSP power-stage control, DC link capacitance, a CAN 2.0B transceiver and a hardware interlock. The AC disconnect and overcurrent protection, the AC EMC filter with precharge and main contactors, AC measurement, the isolation stage, the DC disconnect and DC protection, the interconnection protection and the supervisory controller are all outside the module. Any remote communications sit outside the finished product and attach to the supervisory controller.">
  <title>ADM-PC-BP25 shown as one block inside an example finished AC/DC power conversion system. The module as supplied contains the 3-phase silicon carbide bridge, DSP power-stage control, DC link capacitance, a CAN 2.0B transceiver and a hardware interlock. The AC disconnect and overcurrent protection, the AC EMC filter with precharge and main contactors, AC measurement, the isolation stage, the DC disconnect and DC protection, the interconnection protection and the supervisory controller are all outside the module. Any remote communications sit outside the finished product and attach to the supervisory controller.</title>
