site_name: ADM-PC-LF46 Documentation
site_description: Technical documentation for Advantics ADM-PC-LF46 — 3-phase AC Line Filter and Precharge
# repo_url: https://github.com/ADVANTICS/documentation
# repo_name: gh:ADVANTICS/documentation
edit_uri: edit/material/docs/
site_author: ADVANTICS SAS
copyright: Copyright &copy; 2017-2025 ADVANTICS SAS

# spell-checker: disable

watch:
  - "."

use_directory_urls: true

# Theme configuration
theme:
  name: material
  language: en
  logo: assets/logo.webp
  favicon: assets/favicon.svg

  palette:
    # Light theme
    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark theme
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Font
  font:
    text: Roboto
    code: Roboto Mono

  # Features
  features:
    - navigation.instant  # No reload between pages, use XHR
    - navigation.instant.progress  # Show progress-bar if longer than 400ms
    # - navigation.tracking  # Update URL with scroll
    # - navigation.tabs  # Top-level nav as tabs in header
    - navigation.tabs.sticky  # Header tabs don't dissapear when scrolling down
    - navigation.top  # Back-to-top button
    # - navigation.sections  # Group sections in the sidebar
    # - navigation.expand  # Expand all collapsible navigation sub-sections
    # - navigation.prune  # all sections collapsed by default
    - navigation.path  # Breadcrumb
    - navigation.indexes  # Intermediate section levels can have their own pages
    - navigation.footer  # Prev/Next links at the bottom
    - toc.follow  # TOC sidebar follows scroll
    # - toc.integrate  # Merge TOC into navigation sidebar
    - search.suggest  # Suggest search completion
    - search.highlight  # Highlight search results in the page
    - search.share  # Can create/copy share link for searched
    - header.autohide  # Collapse header entirely as scrolling down
    # - content.action.edit  # Top-right (middle column) edit icon
    # - content.action.view  # Top-right (middle column) view raw icon
    - content.code.copy  # Enable copy button site-wise
    - content.tabs.link

# Plugins
plugins:
  - search
  - mermaid2
  - autorefs
  - plantuml:
      puml_url: "https://www.plantuml.com/plantuml"
      puml_keyword: "puml"
      # Styling is carried INLINE by each diagram (the Advantics skinparam prelude), so the
      # plugin must not inject its own theme: with theme.enabled true it prepends an
      # `!include <github raw url>` that the plantuml server has to fetch, and it cannot.
      # Disabled also means one diagram per block (class "puml light", display:block) instead
      # of a light/dark pair -- which is what products/css/custom.css expects.
      theme:
        enabled: false
  - with-pdf:
      enabled_if_env: PDF_EXPORT
      output_path: pdf/ADM-PC-LF46-manual.pdf
      cover_title: ADM-PC-LF46 User Manual
      cover_subtitle: 3-phase AC Line Filter and Precharge
      author: ADVANTICS SAS
      custom_template_path: docs/assets
  - macros:
      module_name: docs/assets/macros

# Markdown extensions
markdown_extensions:
  - admonition
  # - codehilite
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      permalink_title: "Link to this section"
      baselevel: 1
  - tables
  - attr_list
  - md_in_html

# Navigation structure
nav:
  - "Get Started here": "index.md"
  - "Safety Instructions": "safety_hazards.md"
  - "Module Overview": "introduction.md"
  - "Electrical and Mechanical Overview": "specifications.md"
  - "Theory of operation": "theory_of_operation.md"
  - "Communication Interface": "comm_interface.md"
  - "Application examples": "application_examples.md"
  - Guides:
    - "Quick Start Guide": "quick_start.md"
    - "Installation Guide": "installation.md"
    - "Servicing Guide": "servicing.md"
  - References:
    - "CAN Bus Interface":
      - "CAN bus overview": "can_bus_overview.md"
      - "CAN bus messages": "can_bus_interface.md"
# Extra configurations
extra:
  social:
    - icon: fontawesome/solid/house
      link: https://advantics.fr
    - icon: fontawesome/solid/envelope
      link: mailto:contact@advantics.fr
    - icon: fontawesome/solid/phone
      link: tel:+33123456789

# Custom CSS
extra_css:
  - css/custom.css

# Extra JavaScript for Mermaid
extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  # - docs/assets/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# extra_files:
#   - _puml/advantics-theme-dark.puml
#   - _puml/advantics-theme-light.puml
