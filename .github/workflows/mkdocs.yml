name: Build docs

on:
  push:
    branches:
      - material
    paths:
      - "products/**"
      - ".github/workflows/mkdocs.yml"
  workflow_dispatch:
    inputs:
      product:
        description: "Product to build (leave empty to build all). Must match a folder name under products/."
        required: false
        type: string

jobs:
  # ── Detect which products changed ──────────────────────────────────────────
  # Products are discovered from the folders under products/ that contain a
  # mkdocs.yaml. Builds a dynamic matrix so build-and-upload only runs for
  # products whose files changed. Changes to tools/** or this workflow file
  # are treated as affecting every product, since they're shared build
  # dependencies.
  detect-changes:
    if: github.ref == 'refs/heads/material' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.set-matrix.outputs.products }}

    steps:
      - uses: actions/checkout@v7

      - name: Discover products
        id: discover
        run: |
          products=()
          for dir in products/*/; do
            name=$(basename "$dir")
            [[ -f "${dir}mkdocs.yaml" ]] && products+=("$name")
          done
          IFS=$'\n' products=($(sort <<<"${products[*]}")); unset IFS

          json=$(printf '%s\n' "${products[@]}" | jq -R . | jq -sc .)
          echo "list=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered products: $json"

          {
            echo "filters<<EOF"
            echo "workflow:"
            echo "  - '.github/workflows/mkdocs.yml'"
            echo "tools:"
            echo "  - 'tools/**'"
            for name in "${products[@]}"; do
              echo "$name:"
              echo "  - 'products/$name/**'"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: ${{ steps.discover.outputs.filters }}

      - name: Compute product matrix
        id: set-matrix
        env:
          DISPATCH_PRODUCT: ${{ github.event.inputs.product }}
          ALL_PRODUCTS: ${{ steps.discover.outputs.list }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "$DISPATCH_PRODUCT" ]]; then
              if ! jq -e --arg p "$DISPATCH_PRODUCT" 'index($p) != null' <<<"$ALL_PRODUCTS" >/dev/null; then
                echo "::error::Unknown product '$DISPATCH_PRODUCT'. Available: $ALL_PRODUCTS"
                exit 1
              fi
              products=$(jq -cn --arg p "$DISPATCH_PRODUCT" '[$p]')
            else
              products="$ALL_PRODUCTS"
            fi
          elif jq -e 'any(. == "workflow" or . == "tools")' <<<"$CHANGES" >/dev/null; then
            products="$ALL_PRODUCTS"
          else
            products=$(jq -cn --argjson changes "$CHANGES" --argjson all "$ALL_PRODUCTS" \
              '[$changes[] | select(. as $c | $all | index($c))]')
          fi
          echo "products=$products" >> "$GITHUB_OUTPUT"
          echo "Products to build: $products"

  # ── Build and upload docs ──────────────────────────────────────────────────
  build-and-upload:
    if: (github.ref == 'refs/heads/material' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.products != '[]'
    runs-on: ubuntu-latest
    needs: [detect-changes]

    strategy:
      matrix:
        product: ${{ fromJson(needs.detect-changes.outputs.products) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Build docs
        run: |
          source .venv/bin/activate
          cd products/${{ matrix.product }}
          PDF_EXPORT=1 mkdocs build --clean

      - name: Upload to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_DOCS_USERNAME }}
          password: ${{ secrets.FTP_DOCS_PASSWORD }}
          protocol: ftps
          local-dir: products/${{ matrix.product }}/site/
          # Manual runs (workflow_dispatch) deploy under public_html/staging/
          # instead of the live product path, so testing never overwrites prod.
          server-dir: ${{ github.event_name == 'workflow_dispatch' && format('public_html/staging/{0}/', matrix.product) || format('public_html/{0}/', matrix.product) }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/pdf/*.pdf
      - name: Find and list PDF files
        run: |
          echo "Found the following PDF files:"
          find products -type f -path "*/pdf/*.pdf" -print

      # - name: Upload PDFs as artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: product-pdfs
      #     path: |
      #       products/**/pdf/*.pdf
